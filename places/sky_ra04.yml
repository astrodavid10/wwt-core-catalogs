description: 'The NASA/ESA/CSA James Webb Space Telescope has taken the most detailed
  image of planetary nebula NGC 1514 to date thanks to its unique mid-infrared observations.
  Webb shows its rings as “fuzzy,” intricate clumps of dust. It’s also easier to see
  holes punched through the bright pink central region. [Image description: What looks
  like a single large, bright star (but is two) shines with bright purple diffraction
  spikes at the center of a large, diffuse cylinder of gas and dust that is tipped
  to the right. At the center is a bright pink clumpy cloud that takes up about 25%
  of the view. There are two large rings seen at a roughly 60-degree angle that appear
  joined at top left and bottom right. The edges are denser, and form shallow V-shapes
  that go inward. The rings appear orange at top left and bottom right, and are blue
  at bottom and center right. There is diffuse orange material around the body. The
  black background of space is speckled with tiny stars and galaxies mostly in blues
  and yellows. Areas Webb did not observe are along the top edges, a thin vertical
  near the nebula at top left, and at the bottom left and right corners.]'
