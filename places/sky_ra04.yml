description: Explore HH 30 in unprecedented resolution. An edge-on protoplanetary
  disc that is surrounded by jets and a disc wind, it is located in the dark cloud
  LDN 1551 in the Taurus Molecular Cloud. Herbig-Haro objects are small nebulae found
  in star formation regions, marking the locations where gas outflowing from young
  stars is heated into luminescence by shockwaves. HH 30 is an example of where this
  outflowing gas takes the form of a narrow jet. The source star is located on one
  end of the jet, hidden behind an edge-on protoplanetary disc that the star is illuminating.
