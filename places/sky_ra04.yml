description: A cosmic question mark appears amid a powerful gravitational lens in
  the James Webb Space Telescope’s wide-field view of the galaxy cluster MACS-J0417.5-1154.
  Gravitational lensing occurs when something is so massive, like this galaxy cluster,
  that it warps the fabric of space-time itself, creating a natural funhouse-mirror
  effect that also magnifies galaxies behind it. The rarely seen type of lensing captured
  here, which astronomers term hyperbolic umbilic, created five repeated images of
  one galaxy pair. The red, elongated member of this pair traces the familiar shape
  of a question mark across the sky due to the distortion, with another unrelated
  galaxy happening to be in just the right space-time to appear like the question
  mark’s dot – especially for humans who love to recognize familiar shapes and patterns.
