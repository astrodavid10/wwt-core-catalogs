description: 'The galaxy cluster Abell 2029 is sometimes described as “the most relaxed
  cluster in the Universe.” This moniker does not arise from some sort of mellow vibe,
  but rather because of how calm and undisturbed the superheated gas that pervades
  the cluster appears to be.


  New observations from NASA’s Chandra X-ray Observatory clearly show that Abell 2029
  had a much more colorful history than its current disposition suggests. The latest
  study finds that Abell 2029 is still settling down after a raucous collision with
  another smaller cluster about four billion years ago.'
