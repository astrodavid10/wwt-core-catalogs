  is seen face-on; whereas NGC 5908, in the lower left is seen edge-on. NGC 5908 looks
  remarkably similar to M104, the Sombrero Galaxy. The many bright, reddish stars
  in the image are stars within our own galaxy. These galaxies were observed with
  B (blue), V (green) and I (red) filters. North is up, East is to the left.
