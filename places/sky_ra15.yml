description: On Earth, cocoons are associated with new life. There are “cocoons” in
  space too, but, rather than protecting pupae as they transform into moths, they
  are the birthplaces of new stars. The red cloud seen in this image, taken with the
  EFOSC2 instrument on ESO’s New Technology Telescope, is a perfect example of one
  of these star-forming regions. This is a view of a cloud called RCW 88, which is
  located about ten thousand light-years away and is about nine light-years across.
  It is not made of silk, like a moth’s cocoon, but of glowing hydrogen gas that surrounds
  the recently formed stars. The new stars form from clouds of this hydrogen gas as
  they collapse under their own gravity. Some of the more developed stars, already
  shining brightly, can even be seen peering through the cloud. These hot young stars
  are very energetic and emit large amounts of ultraviolet radiation, which strips
  the electrons from the hydrogen atoms in the cloud, leaving the positively charged
  nuclei — protons. As the electrons are recaptured by the protons, they can emit
  H-alpha light, which has a characteristic red glow. Observing the sky through an
  H-alpha filter is the easiest way for astronomers to find these star-forming regions.
  A dedicated H-alpha filter was one of the four filters used to produce this image.
foreground_image_set_url: http://data1.wwtassets.org/feeds/eso/potw1231a/L{1}X{2}Y{3}.png
name: Red cocoon harbours young stars
ra_hr: 15.119170318071614
thumbnail: http://data1.wwtassets.org/feeds/eso/potw1231a/thumb.jpg
