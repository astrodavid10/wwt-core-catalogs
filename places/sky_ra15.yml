description: 'When the object now called SN 1006 first appeared on May 1, 1006 A.D.,
  it was far brighter than Venus and visible during the daytime for weeks. Astronomers
  in China, Japan, Europe, and the Arab world all documented this spectacular sight,
  which was later understood to have been a supernova . With the advent of the Space
  Age in the 1960s, scientists were able to launch instruments and detectors above
  Earth''s atmosphere to observe the Universe in wavelengths that are blocked from
  the ground , including X-rays . The remains of SN 1006 was one of the faintest X-ray
  sources detected by the first generation of X-ray satellites.


  This new image shows SN 1006 from two of NASA’s current X-ray telescopes, the Chandra
  X-ray Observatory and Imaging X-ray Polarimetry Explorer (IXPE). In the full image
  of SN 1006, red, green, and blue show low-, medium-, and high-energy detected by
  Chandra. The IXPE data, which measure the polarization of the X-ray light, have
  been added in the upper left corner of the remnant in purple. The lines in that
  corner represent the direction of the magnetic field .'
