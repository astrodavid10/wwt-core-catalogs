description: 'Rotating neutron stars with strong magnetic fields, or pulsars, serve
  as laboratories for extreme physics, offering high-energy conditions that cannot
  be replicated on Earth. Young pulsars can create jets of matter and antimatter moving
  away from the poles of the pulsar, along with an intense wind, forming a “pulsar
  wind nebula”.


  In 2001, NASA’s Chandra X-ray Observatory first observed the pulsar PSR B1509-58
  and revealed that its pulsar wind nebula (referred to as MSH 15-52) resembles a
  human hand. The pulsar is located at the base of the “palm” of the nebula. Now Chandra’s
  data of MSH 15-52 have been combined with data from NASA’s newest X-ray telescope,
  the Imaging X-ray Polarimetry Explorer (IXPE) to unveil the magnetic field “bones”
  of this remarkable structure, as reported in our press release . IXPE stared at
  MSH 15-52 for 17 days, the longest it has looked at any single object since it launched
  in December 2021.'
