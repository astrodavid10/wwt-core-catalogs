description: 'This unique image shows AB7, one of the highest excitation nebulae in
  the Magellanic Clouds (MCs), two satellite galaxies of our own Milky Way. AB7 is
  a binary star, consisting of one WR-star — highly evolved massive star - and a mid-age
  massive companion of spectral type O. These exceptional stars have very strong stellar
  winds: they continuously eject energetic particles — like the &quot;solar wind&quot;
  from the Sun — but some 10 to 1,000 million times more intensely than our star!
  These powerful winds exert an enormous pressure on the surrounding interstellar
  material and forcefully shape those clouds into &quot;bubbles&quot;, well visible
  in the photos by their blue colour. AB7 is particularly remarkable: the associated
  huge nebula and HeII region indicate that this star is one of the, if not the, hottest
  WR-star known so far, with a surface temperature in excess of 120,000 degrees !
  Just outside this nebula, a small network of green filaments is visible — they are
  the remains of another supernova explosion.'
foreground_image_set_url: http://data1.wwtassets.org/feeds/eso/eso0310a/L{1}X{2}Y{3}.png
name: Really hot stars
ra_hr: 1.0596827500156025
