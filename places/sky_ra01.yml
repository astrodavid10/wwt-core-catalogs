description: Elliptical galaxies are generally characterized by their relatively smooth
  appearance when compared with spiral galaxies (one of which is to the left), which
  have more flocculent structures interwoven with dust lanes and spiral arms. NGC
  474 is at a distance of about 100 million light-years in the constellation of Pisces.
  This image shows unusual structures around NGC 474 characterized as tidal tails
  and shell-like structures made up of hundreds of millions of stars. These features
  are due to recent mergers (within the last billion years) or close interactions
  with smaller infalling dwarf galaxies.  This image is an excerpt from the Dark Energy
  Survey, which has released a massive, public collection of astronomical data and
  calibrated images from six years of work. The Dark Energy Survey is a global collaboration
  that includes the Department of Energy&#x27;s (DOE) Fermi National Accelerator Laboratory
  (Fermilab), the National Center for Supercomputing Applications (NCSA), and NSF’s
  NOIRLab. The image was taken with the Dark Energy Camera, fabricated by DOE, on
  the Víctor M. Blanco 4-meter Telescope. The quality of the survey can be appreciated
  by diving into the zoomable version of this wider excerpt showing a background tapestry
  of thousands of distant galaxies. 
foreground_image_set_url: http://data1.wwtassets.org/feeds/noirlab/noirlab2106a/L{1}X{2}Y{3}.png
name: Elliptical galaxy NGC 474 — excerpt from the Dark Energy Survey
