description: 'A massive, spacetime-warping cluster of galaxies is the setting of today’s
  NASA/ESA Hubble Space Telescope Picture of the Week. The galaxy cluster in question
  is Abell 209, which is located 2.8 billion light-years away in the constellation
  Cetus (The Whale). This Hubble image of Abell 209 shows more than a hundred galaxies,
  but there’s more to this cluster than even Hubble’s discerning eye can see. Abell
  209’s galaxies are separated by millions of light-years, and the seemingly empty
  space between the galaxies is actually filled with hot, diffuse gas that can be
  spotted only at X-ray wavelengths. An even more elusive occupant of this galaxy
  cluster is dark matter: a form of matter that does not interact with light. The
  Universe is understood to be comprised of 5% normal matter, 25% dark matter, and
  70% dark energy. Hubble observations like the ones used to create this image can
  help astronomers answer fundamental questions about our Universe, including mysteries
  surrounding dark matter and dark energy. These investigations leverage the immense
  mass of a galaxy cluster, which can bend the fabric of spacetime itself and create
  warped and magnified images of background galaxies and stars in a process called
  gravitational lensing. While this image lacks the dramatic rings that gravitational
  lensing can sometimes create, Abell 209 still shows subtle signs of lensing at work,
  in the form of streaky, slightly curved galaxies within the cluster’s golden glow.
  By measuring the distortion of these galaxies, astronomers can map the distribution
  of mass within the cluster, illuminating the underlying cloud of dark matter. This
  information, which Hubble’s fine resolution and sensitive instruments help to provide,
  is critical for testing theories of how our Universe has evolved. [Image Description:
  A cluster of distant, mainly elliptical galaxies. They appear as brightly shining
  points radiating golden light that each take the shape of a smooth, featureless
  oval. They crowd around one that is extremely large and bright. A few spiral galaxies
  of comparable size appear too, bluer in colour and with unique shapes. Of the other,
  more small and distant galaxies covering the scene, a few are warped into long lines.]
  Links Pan: Abell 209'
