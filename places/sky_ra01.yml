description: 'When astronomers discovered the galaxy cluster ACT-CL J0102-4915 in
  2012 with NASA''s Chandra X-ray Observatory and ground-based optical telescopes,
  they nicknamed it "El Gordo" (Spanish for the "Fat One") because of its gigantic
  mass. Scientists estimate that El Gordo contains as much as 3 million billion (3,000,000,000,000,000)
  times the mass of the Sun. Thanks to its heft, El Gordo acts as a natural lens,
  distorting the light from more distant objects behind it through a process known
  as gravitational lensing.


  A new composite image of El Gordo shows the diffuse, superheated gas in the cluster
  observed in X-rays from Chandra (blue) that have been combined with a new infrared
  image from NASA''s James Webb Space Telescope (red, green, and blue). Webb''s image
  shows galaxies in El Gordo plus background galaxies located further away from Earth.
  El Gordo is located about 7.3 billion light-years from Earth and the background
  galaxies are at a range of different distances including several that are 12.3 billion
  light-years from Earth. The appearance of some of the background galaxies has been
  distorted into a variety of unusual and highly elongated shapes because of gravitational
  lensing by the cluster.'
