description: 'Near the outskirts of the Small Magellanic Cloud, a satellite galaxy
  roughly 200 000 light-years from Earth, lies the young star cluster NGC 602, which
  is featured in this new image from the NASA/ESA/CSA James Webb Space Telescope.
  This image includes data from Webb’s NIRCam (Near-InfraRed Camera) and MIRI (Mid-InfraRed
  Instrument). The local environment of this cluster is a close analogue of what existed
  in the early Universe, with very low abundances of elements heavier than hydrogen
  and helium. The existence of dark clouds of dense dust and the fact that the cluster
  is rich in ionised gas also suggest the presence of ongoing star formation processes.
  This cluster provides a valuable opportunity to examine star formation scenarios
  under dramatically different conditions from those in the solar neighbourhood. An
