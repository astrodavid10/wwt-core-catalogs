description: The irregular star cluster M103, or NGC581, is a distant cluster in the
  constellation Cassiopeia. One of the more remote open clusters, at about 8000 light-years,
  M103s relatively small angular size still corresponds to a sizable 14 light-year
  diameter (this image is only 8.6 arc minutes across). The bright binary (upper right,
  NW) is not part of the cluster. M103 may be over 20 million years old (there seems
  to be some dispute over its actual age). M103 is one of the &#x27;extra&#x27; objects
  added from Méchain&#x27;s observations but not actually observed by Messier. This
  true-color picture was created from fifteen images taken in the BVR pass-bands at
  the Kitt Peak National Observatory&#x27;s 2.1-meter telescope, during the night
  of December 24th 2000 (yes, Christmas Eve).
