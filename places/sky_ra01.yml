description: 'Since antiquity, wreaths have symbolized the cycle of life, death, and
  rebirth. It is fitting then that one of the best places for astronomers to learn
  more about the stellar lifecycle resembles a giant holiday wreath itself.


  The star cluster NGC 602 lies on the outskirts of the Small Magellanic Cloud, which
  is one of the closest galaxies to the Milky Way , about 200,000 light-years from
  Earth. The stars in NGC 602 have fewer heavier elements compared to the Sun and
  most of the rest of the galaxy. Instead, the conditions within NGC 602 mimic those
  for stars found billions of years ago when the universe was much younger.'
