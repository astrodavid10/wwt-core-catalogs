description: NGC 474 is at a distance of about 100 million light-years in the constellation
  of Pisces. This image shows unusual structures around NGC 474 characterized as tidal
  tails and shell-like structures made up of hundreds of millions of stars.  This
  image is an excerpt from the Dark Energy Survey, which has released a massive, public
  collection of astronomical data and calibrated images from six years of work. The
  Dark Energy Survey is a global collaboration that includes the Department of Energy&#x27;s
  (DOE) Fermi National Accelerator Laboratory (Fermilab), the National Center for
  Supercomputing Applications (NCSA), and NSF’s NOIRLab. The image was taken with
  the Dark Energy Camera, fabricated by DOE, on the Víctor M. Blanco 4-meter Telescope.
  The quality of the survey can be appreciated by diving into this zoomable version
  showing a background tapestry of thousands of distant galaxies. 
