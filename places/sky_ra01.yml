description: 'Astronomers have discovered a special kind of neutron star for the first
  time outside of the Milky Way galaxy, using data from NASA''s Chandra X-ray Observatory
  and the European Southern Observatory''s Very Large Telescope (VLT) in Chile.


  Neutron stars are the ultra dense cores of massive stars that collapse and undergo
  a supernova explosion . This newly identified neutron star is a rare variety that
  has both a low magnetic field and no stellar companion.'
