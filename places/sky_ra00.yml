  Galaxy is a large spiral galaxy very similar to our own Galaxy, the Milky Way. It
  is over 65,000 light-years in diameter and approximately 2.2 million light-years
  in distance. The area shown in this image is quite large on the sky, covering about
  five times the area of the full Moon. This true-color image was created by combining
  images taken in seven filters: U (violet), B (blue), V (green), R (orange), I (red),
  Hydrogen-Alpha (red) and Oxygen [OIII] (green).'
