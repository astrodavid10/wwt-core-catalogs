description: No, this is not a firework display. This is Pa 30 — the likely remnant
  of the historic supernova witnessed in the year 1181, now captured here in unprecedented
  detail by the Gemini North telescope, one half of the International Gemini Observatory,
  partly funded by the U.S. National Science Foundation (NSF) and operated by NSF
  NOIRLab. This image was captured with the Gemini Multi-Object Spectrograph (GMOS),
  and it shows that the remnant’s unmistakable firework-shaped ejecta take on a cascading
  knot-like structure.
