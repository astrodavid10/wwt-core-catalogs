description: 'The spiral galaxy NGC 298 basks in this image from the NASA/ESA Hubble
  Space Telescope. NGC 298 lies around 89 million light-years away in the constellation
  Cetus, and appears isolated in this image — only a handful of distant galaxies and
  foreground stars accompany the lonely galaxy. While NGC 298 seems peaceful, in 1986
  it was host to one of astronomy''s most extreme events: a catastrophic stellar explosion
  known as a Type II supernova. Hubble’s Advanced Camera for Surveys captured NGC
  298 as part of an investigation into the origins of Type II supernovae. All Type
  II supernovae are produced by the collapse and subsequent explosion of young, massive
  stars, but they can produce a spectacular diversity of brightnesses and spectral
  features. Astronomers suspect that the diversity of this cosmic firework show might
  be due to gas and dust being stripped from the stars that will eventually produce
  Type II supernovae. Observing the region surrounding supernova explosions can reveal
  traces of the progenitor star’s history preserved in this lost mass, as well as
  revealing any companion stars that survived the supernova. Hubble used the brief
  periods between scheduled observations to explore the aftermath of a number of Type
  II supernovae, hoping to piece together the relationship between Type II supernovae
  and the stellar systems which give rise to them. [Image description: A spiral galaxy.
  It is tilted diagonally, and slightly towards the viewer, making its core and disc
  separately visible. Its disc is speckled by small stars, has threads of dark reddish
  dust and bubbles of bright, glowing gas. The core shines brightly in a warmer colour.
  Several tiny stars and small galaxies are included in the black background.] Links
  Pan: Hubble explores explosive aftermath in NGC 298'
