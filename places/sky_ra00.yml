  striking image from NOIRLab’s Kitt Peak National Observatory (KPNO) presents a portrait
  of the irregular galaxy IC 10, a disorderly starburst galaxy close to the Milky
  Way. As well as a population of bright young stars, this irregular galaxy harbors
  exotic Wolf-Rayet stars and a black hole. IC 10 lies around 2 million light-years
  from Earth in the direction of the constellation of Cassiopeia. Though this distance
  seems huge, it puts IC 10 in the ever-growing Local Group of galaxies.
