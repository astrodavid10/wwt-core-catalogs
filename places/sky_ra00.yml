description: 'This image features Abell 98, a system of galaxy clusters that includes
  a pair in the early stages of a collision. Astronomers have used data from NASA’s
  Chandra X-ray Observatory (shown as blue and purple with optical data from the WIYN
  telescope on Kitt Peak in Arizona appearing white and red) to identify key structures
  and look for “missing” matter in the Universe.


  This missing material is not dark matter, which is invisible, of an unknown nature,
  and thought to constitute most of the matter in the universe, but “normal” matter
  found in familiar objects like stars, planets, and humans. About a third of this
  matter that was created in the first billion years or so after the Big Bang has
  yet to be detected by observations of the local universe, that is, in regions less
  than a few billion light-years from Earth.'
