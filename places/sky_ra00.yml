description: 'In the year 1181 a rare supernova explosion appeared in the night sky,
  staying visible for 185 consecutive days. Historical records show that the supernova
  looked like a temporary ‘star’ in the constellation Cassiopeia shining as bright
  as Saturn.


  Ever since, scientists have tried to find the supernova’s remnant. At first it was
  thought that this could be the nebula around the pulsar — the dense core of a collapse
  star — named 3C 58. However closer investigations revealed that the pulsar is older
  than supernova 1181.'
