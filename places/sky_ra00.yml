dec_deg: 64.13492439906642
description: 'This image provides a new look at the Tycho supernova remnant, named
  for Danish astronomer Tycho Brahe who noticed the bright glow of this new “star”
  in the constellation Cassiopeia more than 450 years ago. Astronomers used NASA’S
  Imaging X-ray Polarimetry Explorer (IXPE) to study polarized light from Tycho, the
  debris from an exploded star, as described in IXPE’s latest press release . IXPE
  revealed, for the first time, the geometry of the magnetic fields close to the supernova’s
  blast wave, which is still propagating from the initial explosion and forms a boundary
  around the ejected material. Understanding the magnetic field geometry allows scientists
  to further investigate how particles are accelerated there.


  In this composite image, data from IXPE (dark purple and white) have been combined
  with those from NASA’s Chandra X-ray Observatory (red and blue), which were overlaid
  with the stars in the field of view seen by the Digitized Sky Survey.'
foreground_image_set_url: https://data1.wwtassets.org/feeds/chandra/2023-tycho/L{1}X{2}Y{3}.png
name: Tycho's Supernova Remnant (2023)
