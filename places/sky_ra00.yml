description: In the constellation Sculptor lies this large extended spiral galaxy
  called NGC 289. Despite being around 75 million light-years away, the light of NGC
  289 is stunningly captured here by the Dark Energy Camera (DECam) on the Víctor
  M. Blanco 4-meter Telescope at Cerro Tololo Inter-American Observatory (CTIO), a
  Program of NSF NOIRLab. The galaxy’s bluish arms reach through the expanse of space
  over 100,000 light-years, larger than the size of our own Milky Way. It’s classified
  as a Type II Seyfert galaxy with its ripe collections of star formation and bright
  core, but it’s also relatively faint. Studies have found that the galaxy contains
  large amounts of dark matter, which is a common feature of all galaxies with a low
  surface brightness. Dark matter is yet to be directly observed, which led the US
  Department of Energy to build the DECam in order to study the nature of dark matter.
  Since the conclusion of its survey, DECam has been available to other scientists
  for use, such as for this image of NGC 289.
