description: This NOIRLab Image of the Week of the Small Magellanic Cloud (SMC) was
  not taken with a telescope! It was instead captured using a camera and a wide-aperture
  telephoto lens. It was taken by Petr Horálek, a NOIRLab Audiovisual Ambassador.
  Petr captured this special image for almost four hours during a night spent under
  clear skies on Cerro Pachón in Chile. Cerro Pachón is a mountain in the foothills
  of Chile’s Andes range. Northern Chile offers some of the clearest, driest, and
  darkest skies in the world. These conditions create ample opportunities for astrophotography
  and for addressing some of our biggest questions about the Universe. The summit
  of Cerro Pachón is home to several telescopes operated by NSF NOIRLab including
  the SOAR Telescope, a part of the U.S. National Science Foundation (NSF) Cerro Tololo
  Inter-American Observatory (CTIO), a Program of NSF NOIRLab; Gemini South, one half
  of the International Gemini Observatory, funded in part by the NSF; and NSF–DOE
  Vera C. Rubin Observatory, which is jointly funded by the NSF and the U.S. Department
  of Energy Office of Science (DOE/SC). The Small Magellanic Cloud and Large Magellanic
  Cloud (LMC) are the largest of the 60+ satellite galaxies of the Milky Way. Satellite
  galaxies orbit around a host galaxy and are usually smaller than their host galaxy.
  The SMC was once even a satellite galaxy of the LMC! Unlike most of the other satellite
  galaxies of the Milky Way, the SMC is actively forming stars at a rapid pace, a
  process revealed by the blue light in this image. Petr similarly captured the LMC
  from Cerro Pachón as an earlier NSF NOIRLab Image of the Week.
