description: 'In 1572, Danish astronomer Tycho Brahe was among those who noticed a
  new bright object in the constellation Cassiopeia. Adding fuel to the intellectual
  fire that Copernicus started, Tycho showed this "new star" was far beyond the Moon,
  and that it was possible for the Universe beyond the Sun and planets to change.


  Astronomers now know that Tycho''s new star was not new at all. Rather it signaled
  the death of a star in a supernova , an explosion so bright that it can outshine
  the light from an entire galaxy. This particular supernova was a Type Ia , which
  occurs when a white dwarf star pulls material from, or merges with, a nearby companion
  star until a violent explosion is triggered. The white dwarf star is obliterated,
  sending its debris hurtling into space.'
foreground_image_set_url: https://data1.wwtassets.org/feeds/chandra/2019-tycho/L{1}X{2}Y{3}.png
name: Tycho's Supernova Remnant (2019)
