description: The Gemini North telescope, one half of the International Gemini Observatory,
  operated by NSF NOIRLab, captured this dazzling image of the so-called Taffy Galaxies
  — UGC 12914 and UGC 12915. Their twisted appearance is the result of a head-on collision
  that occurred about 25 million years prior to their appearance in this image. A
  bridge of highly turbulent gas devoid of significant star formation spans the gap
  between the two galaxies. This image was obtained by NOIRLab’s Communication, Education
  & Engagement team as part of the NOIRLab Legacy Imaging Program.
