_uuid: dec9efd7-2979-469f-8b1c-9cab1d4b7f72
classification: ''
constellation: HOR
data_set_type: Sky
dec_deg: -50.31864588236337
description: 'This Hubble Picture of the Week features a richness of spiral galaxies:
  the large, prominent spiral galaxy on the right side of the image is NGC 1356; the
  two apparently smaller spiral galaxies flanking it are LEDA 467699 (above it) and
  LEDA 95415 (very close at its left) respectively; and finally, IC 1947 sits along
  the left side of the image. ThIs image is a really interesting example of how challenging
  it can be to tell whether two galaxies are actually close together, or just seem
  to be from our perspective here on Earth. A quick glance at this image would likely
  lead you to think that NGC 1356, LEDA 467699 and LEDA 95415 were all close companions,
  whilst IC 1947 was more remote. However, we have to remember that two-dimensional
  images such as this one only give an indication of angular separation: that is,
  how objects are spread across the sphere of the night sky. What they cannot represent
  is the distance objects are from Earth. For instance, whilst NGC 1356 and LEDA 95415
  appear to be so close that they must surely be interacting, the former is about
  550 million light-years from Earth and the latter is roughly 840 million light-years
  away, so there is nearly a whopping 300 million light-year separation between them.
  That also means that LEDA 95415 is likely nowhere near as much smaller than NGC
  1356 as it appears to be. On the other hand, whilst NGC 1356 and IC 1947 seem to
  be separated by a relative gulf in this image, IC 1947 is only about 500 million
  light-years from Earth. The angular distance apparent between them in this image
  only works out to less than four hundred thousand light-years, so they are actually
  much much closer neighbours in three-dimensional space than NGC 1356 and LEDA 95415!
  [Image Description: A collection of galaxies. On the left side a large spiral galaxy
  with swirling, twisted arms is flanked by a smaller, but still detailed, spiral
  behind its arm on the left, and a smaller spiral above it. On the right side is
  a fourth, round spiral galaxy seen face-on. Between them lies a single bright star.
  Several stars and distant galaxies dot the background.] Links Pan: It’s all relative'
foreground_image_set_url: https://data1.wwtassets.org/feeds/hst/potw2352a/L{1}X{2}Y{3}.png
name: It’s all relative
ra_hr: 3.510275101073133
