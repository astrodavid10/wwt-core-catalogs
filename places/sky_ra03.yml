description: 'The NASA/ESA/CSA James Webb Space Telescope recently observed IC 348,
  a star-forming region just 1000 light-years away. This is one of the largest Webb
  images released to the public so far. This near-infrared vista of IC 348 reveals
  a collection of objects called brown dwarfs, which are smaller than the smallest
  stars. Researchers used the unparalleled sensitivity of Webb’s NIRCam (Near-Infrared
  Camera) to track down the smallest brown dwarfs in IC 348, which weigh in at just
  just twice the mass of Jupiter. These are the least massive brown dwarfs known,
  and their existence poses challenges to models of how stars form. In addition to
  the brown dwarfs and young stars scattered across the swirling nebula, this image
  provides a unique perspective on a handful of protostars, which can be seen in the
  upper-right corner. These protostars are ejecting powerful jets that have crashed
  into the gas and dust surrounding them, creating luminous regions called Herbig-Haro
  objects. [Image Description: A star-forming region. It is blanketed in thick clouds
  of gas and dust, millions of kilometres across, that form swirling patterns. Bright
  stars are scattered throughout the clouds, with the densest cluster situated in
  the centre of the scene. Each is crowned with six long points created by the optics
  of the telescope’s mirrors. In the upper right, a couple of hidden stars blast out
  long, glowing jets of material.]'
