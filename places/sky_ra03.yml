  of 1997. The Pleiades, also known as the Seven Sisters and Messier object 45, and
  Subaru in Japanese (check the logo on the cars of the same name), is one of the
  more prominent naked eye objects in the sky and, as such, has been known since antiquity,
  including three mentions in the bible. The Pleiades are embedded in a blue reflection
  nebula, clearly visible around Merope in this image.
