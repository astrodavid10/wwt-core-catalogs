description: 'This image showcases a portion of the larger IC 348 field to highlight
  two stars embedded within a cloud of gas and dust. The central star, despite being
  brighter and appearing larger than its companion to the lower-right, is in fact
  more deeply wrapped in the clouds of gas and dust. These clouds block more of the
  shorter-wavelength infrared light that the star emits, leaving it brightest in the
  longer wavelengths, which in this image are coloured orange. The smaller star is
  less shrouded, so the shorter and longer infrared wavelengths combine to make it
  appear whitish-blue. The galaxies seen in the background are thousands of times
  further away from Earth than these two stars. The bright lines appearing to radiate
  out from these stars are a type of distortion that arises from the optical design
  of the telescope. Called diffraction spikes, they are created because the intense
  light from the unresolved target is bent (“diffracted”) very slightly at the edges
  of Webb’s hexagonal mirror panels and around one of the struts that hold up its
  secondary mirror. This distinctive six-plus-two-pointed pattern is the same for
  any image taken by Webb. For diffraction spikes to appear, the light source has
  to be very bright and very concentrated, so they’re most often seen on stars. You
  can view the full image from which this crop was taken here. [Image description:
  A star embedded within a cloud of gas and dust. The star is a very bright point
  in the centre of the image. It radiates six long and two short orange spikes of
  light, caused by the telescope''s optics. Most of the gas behind it is blue and
  wispy, but below the star is a patch of bold yellow and red gas in a butterfly-shape.
  A few glowing shockwaves made by fast-moving gas surround the star. Small, whitish
  galaxies appear in the distance.]'
