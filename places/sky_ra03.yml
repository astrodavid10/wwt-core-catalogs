_uuid: a6f5081d-26f3-42e0-a22f-80cfaa7d6092
classification: ''
constellation: ERI
data_set_type: Sky
dec_deg: -29.927113067238704
description: 'This Hubble Picture of the Week features a massive cluster of brightly
  glowing galaxies, first identified as Abell 3192. Like all galaxy clusters, this
  one is suffused with hot gas that emits powerful X-rays, and it is enveloped in
  a halo of invisible dark matter. All this unseen material — not to mention the many
  galaxies visible in this image — comprises such a huge amount of mass that the galaxy
  cluster noticeably curves spacetime around it, making it into a gravitational lens.
  Smaller galaxies behind the cluster appear distorted into long, warped arcs around
  the cluster’s edges. The galaxy cluster is located in the constellation Eridanus,
  but the question of its distance from Earth is a more complicated one. Abell 3192
  was originally documented in the 1989 update of the Abell catalogue, a catalogue
  of galaxy clusters that was first published in 1958. At that time, Abell 3192 was
  thought to comprise a single cluster of galaxies, concentrated at a single distance.
  However, further research revealed something surprising: the cluster’s mass seemed
  to be densest at two distinct points rather than one. It was subsequently shown
  that the original Abell cluster actually comprised two independent galaxy clusters
  — a foreground group around 2.3 billion light-years from Earth, and a further group
  at the greater distance of about 5.4 billion light-years from our planet. The more
  distant galaxy cluster, included in the Massive Cluster Survey as MCS J0358.8-2955,
  is central in this image. The two galaxy groups are thought to have masses equivalent
  to around 30 trillion and 120 trillion times the mass of the Sun, respectively.
  Both of the two largest galaxies at the centre of this image are part of MCS J0358.8-2955;
  the smaller galaxies you see here, however, are a mixture of the two groups within
  Abell 3192. [Image Description: A cluster of galaxies, concentrated around what
  appear to be two large elliptical galaxies. The rest of the black background is
  covered in smaller galaxies of all shapes and sizes. In the top left and bottom
  right, beside the two large galaxies, some galaxies appear notably distorted into
  curves by gravity.] Links Science paper by V. Hamilton-Morris et al. Pan: One cluster
  or two?'
foreground_image_set_url: https://data1.wwtassets.org/feeds/hst/potw2348a/L{1}X{2}Y{3}.png
name: One cluster or two?
ra_hr: 3.9812358608132277
thumbnail: https://data1.wwtassets.org/feeds/hst/potw2348a/thumb.jpg
