description: 'This stunning new mosaic of images from the NASA/ESA/CSA James Webb
  Space Telescope showcases the nearby star-forming cluster, NGC 1333. The nebula
  is in the Perseus molecular cloud, and located approximately 960 light-years away.
  Webb’s superb sensitivity allows astronomers to investigate young objects with extremely
  low masses. Some of the faintest ‘stars’ in the picture are in fact newly born free-floating
  brown dwarfs with masses comparable to those of giant planets. The same cluster
  was featured as the 33rd anniversary image of the NASA/ESA Hubble Space Telescope
  in April of 2023. Hubble’s image just scratched the surface of this region, because
  clouds of dust obscure much of the star formation process. Observing with larger
  aperture and in the infrared part of the spectrum, Webb is capable of peering through
  the dusty veil to reveal newborn stars, brown dwarfs and planetary mass objects.
  The centre of the image presents a deep peek into the heart of the NGC1333 cloud.
  Across the image we see large patches of orange, which represent gas glowing in
  the infrared. These so-called Herbig-Haro objects form when ionised material ejected
  from young stars collides with the surrounding cloud. They are hallmarks of a very
  active site of star formation. Many of the young stars in this image are surrounded
  by disks of gas and dust, which may eventually produce planetary systems. On the
  right hand side in the image, we can glimpse the shadow of one of these disks oriented
  edge-on - two dark cones emanating on opposite sides, seen against a bright background.
  Similar to the young stars in this mosaic, our own Sun and planets formed inside
  a dusty molecular cloud, 4.6 billion years ago. Our Sun didn’t form in isolation
  but as part of a cluster, which was perhaps even more massive than NGC 1333. The
  cluster in the mosaic, only 1-3 million years old, presents us with an opportunity
  to study stars like our Sun, as well as brown dwarfs and free-floating planets,
  in their nascent stages. The images were captured as part of the Webb observation
  programme 1202 (PI: A. Scholz) to survey a large portion of NGC1333. These data
  constitute the first deep spectroscopic survey of the young cluster, and have identified
  brown dwarfs down to planetary masses using the observatory’s Near-InfraRed Imager
  and Slitless Spectrograph (NIRISS). The first results from this survey have been
  accepted for publication in the Astronomical Journal. [Image Description: Several
  images of parts of a nebula in space have been aligned to form a single large image
  of the nebula. It depicts clouds of gas and dust in blue and orange colours as well
  as brightly shining stars in various sizes. Around the edge there are some black
  rectangles where there was no image of that region of space.] Links Science paper
  NGC 1333 (cropped)'
