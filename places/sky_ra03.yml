description: 'A gigantic and resilient "cold front" hurtling through the Perseus galaxy
  cluster has been studied using data from NASA''s Chandra X-ray Observatory. This
  cosmic weather system spans about two million light years and has been traveling
  for over 5 billion years, longer than the existence of our Solar System.


  This graphic shows the cold front in the Perseus cluster. The image above contains
  X-ray data from Chandra — for regions close to the center of the cluster —along
  with data from ESA''s XMM-Newton and the now-defunct German Roentgen (ROSAT) satellite
  for regions farther out. The Chandra data have been specially processed to brighten
  the contrast of edges to make subtle details more obvious.'
