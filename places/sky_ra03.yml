  space telescope already spotted 4.5 million galaxies in this field. In the coming
  years, Euclid will make 52 observations of this field to reach its full depth.


  Euclid’s Deep Field Fornax spans 12.1 square degrees and is located in the southern
  constellation Fornax, the furnace. It encompasses the much smaller Chandra Deep
  Field South, a 0.11 square degree region of the sky that has been extensively surveyed
  in the past couple of decades with NASA''s Chandra and ESA''s XMM-Newton X-ray observatories,
  as well as the NASA/ESA Hubble Space Telescope and major ground-based telescopes.

