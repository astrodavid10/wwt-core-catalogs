description: 'Rich with detail, the spiral galaxy NGC 1309 shines in this NASA/ESA
  Hubble Space Telescope Picture of the Week. NGC 1309 is situated about 100 million
  light-years away in the constellation Eridanus. This stunning Hubble image encompasses
  NGC 1309’s bluish stars, dark brown gas clouds and pearly white centre, as well
  as hundreds of distant background galaxies. Nearly every smudge, streak and blob
  of light in this image is an individual galaxy. The only exception to the extragalactic
  ensemble is a star, which can be identified near the top of the frame by its diffraction
  spikes. It is positively neighbourly, just a few thousand light-years away in the
  Milky Way galaxy. Hubble has turned its attention toward NGC 1309 several times;
  previous Hubble images of this galaxy were released in 2006 and 2014. Much of NGC
  1309’s scientific interest derives from two supernovae, SN 2002fk in 2002 and SN
  2012Z in 2012. SN 2002fk was a perfect example of a Type Ia supernova, which happens
  when the core of a dead star (a white dwarf) explodes. SN 2012Z, on the other hand,
  was a bit of a renegade. It was classified as a Type Iax supernova: while its spectrum
  resembled that of a Type Ia supernova, the explosion wasn’t as bright as expected.
  Hubble observations showed that in this case, the supernova did not destroy the
  white dwarf completely, leaving behind a ‘zombie star’ that shone even brighter
  than it did before the explosion. Hubble observations of NGC 1309 taken across several
  years also made this the first time the white dwarf progenitor of a supernova has
  been identified in images taken before the explosion. [Image Description: A top-down
  view of a spiral galaxy, showing its brightly shining centre, its broad spiral arms
  and the faint halo around its disc, as well as distant galaxies and stars on a dark
  background. Large blue clouds of gas speckled with small stars and strands of dark
  dust swirl around the galaxy’s disc. A couple of the background galaxies are large
  enough that their own swirling spiral arms can be seen.] Links Pan: NGC 1309'
