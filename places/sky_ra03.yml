description: Colour composite photo of the central area of NGC 1316, a giant elliptical
  galaxy in the Fornax cluster of galaxies. Many dark dust clouds and lanes are visible.
  Some of the star-like objects in the field are globular clusters of stars that belong
  to the galaxy. It is based on CCD exposures, obtained with the 8.2-m VLT/ANTU telescope
  and the FORS-1  multi-mode instrument through B (blue), V (green-yellow) and I (here
  rendered as red) filters, respectively. The &quot;pyramids&quot; above and below
  the bright centre of the galaxy and the vertical lines at some of the brighter stars
  are caused by overexposure (&quot;CCD bleeding&quot;). The field measures 6.8 x
  6.8 arcmin 2, with 0.2 arcsec/pixel. The image quality of this composite is about
  0.9 arcsec. North is up and East is left.
