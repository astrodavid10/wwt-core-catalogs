description: 'The infrared image shown here was taken as part of the JADES programme
  (the JWST Advanced Deep Extragalactic Survey) and shows a portion of an area of
  the sky known as GOODS-South. This region was the focus area of Webb study for an
  international team of astronomers, who observed the chemical signature of carbon-rich
  dust grains at redshift ~7. This is roughly equivalent to one billion years after
  the birth of the Universe. Similar observational signatures have been observed in
  the much more recent Universe, attributed to complex, carbon-based molecules known
  as polycyclic aromatic hydrocarbons (PAHs). It is not thought likely, however, that
  PAHs would have developed within the first billion years of cosmic time. Therefore,
  this observation suggests the exciting possibility that Webb may have observed a
  different species of carbon-based molecule: possibly minuscule graphite- or diamond-like
  grains produced by the earliest stars or supernovae. This observation suggests exciting
  avenues of investigation into both the production of cosmic dust and the earliest
  stellar populations in our Universe, and was made possible by Webb’s unprecedented
  sensitivity. In this image, blue, green, and red were assigned to Webb’s NIRCam
  (Near-Infrared Camera) data at 0.9, 1.15, and 1.5 microns; 2.0, 2.77, and 3.55 microns;
  and 3.56, 4.1, and 4.44 microns (F090W, F115W, and F150W; F200W, F277W, and F335M;
  and F356W, F410M, and F444W), respectively. [Image description: The image shows
  a deep galaxy field, featuring thousands of galaxies of various shapes and sizes.]'
