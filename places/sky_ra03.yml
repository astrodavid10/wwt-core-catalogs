description: 'This image from the NASA/ESA/CSA James Webb Space Telescope shows the
  central portion of the star cluster IC 348. The wispy curtains filling the image
  are interstellar gas and dust reflecting the light from the cluster’s stars — what
  is known as a reflection nebula. The material also includes carbon-containing molecules
  known as polycyclic aromatic hydrocarbons, or PAHs. The bright star closest to the
  centre of the frame is actually a pair of type B stars in a binary system, the most
  massive stars in the cluster. Winds from these stars may help sculpt the large loop
  seen on the right side of the field of view. You can view the full image from which
  this crop was taken here. [Image description: Wispy, criss-crossing filaments fill
  the scene, creating dense and highly textured layers of gas in colours from green
  to yellow to orange and pink. Above the centre, the filaments join into a large
  loop, while below they bend and create wave-like curves. Dozens of bright stars
  are layered atop the gas, a pair in the centre being particularly bright; all sport
  six long and two short spikes of light, created by the telescope’s optics.]'
