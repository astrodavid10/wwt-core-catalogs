description: 'Astronomers have used NASA’s Chandra X-ray Observatory to break down
  the cause of a remarkable formation of radio waves they have nicknamed the “Treble
  Clef” because its distinct shape strongly resembles the musical symbol.


  The researchers discovered the Treble Clef is likely caused by an outburst from
  a supermassive black hole, followed by a collision of two galaxy clusters. A paper
  describing the findings, led by Andrea Botteon of the National Institute for Astrophysics,
  or INAF, in Italy, published Wednesday in the Astronomy & Astrophysics journal.'
