description: This image is a combination of a K-band image from ANTU/ISAAC   with
  two images obtained in the B and R bands with the SUSI-2  optical imager at the
  New Technology Telescope (NTT) on La Silla. Note the relatively high density of
  red galaxies, visible in the upper right part of this image. The colours of most
  of these galaxies are consistent with those of &quot;evolved&quot; galaxies, already
  present when the Universe was only 4 billions years old. The redshift, estimated
  on the basis of the measured colours of the mentioned over-density of yellow galaxies,
  is between 0.6 and 0.7 and that of the red galaxies is between 1 and 1.4.
