  and slightly below the center of the galaxy. This image was captured by the Gemini
  South telescope in Chile using its Gemini Multi-Object Spectrograph (GMOS). Gemini
  South is one half of the International Gemini Observatory, an international collaboration
  led by the NSF, in partnership with Canada, Chile, Brazil, Argentina, and the Republic
  of Korea, and operated by NSF NOIRLab. Caught early and still approaching its expected
  maximum brightness, SN 2026ahvu gives astronomers a valuable opportunity to study
  a stellar explosion as it unfolds. NSF NOIRLab is coordinating observations across
  the facilities it operates, working with its partners to maximize scientific return,
  and inviting other observatories to join the effort.
