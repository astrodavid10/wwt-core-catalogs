description: 'Though interesting to look at, NGC 1511 is one galaxy you might not
  want for a neighbour. Seen in this ESA/Hubble Picture of the Week, NGC 1511 is a
  peculiar spiral galaxy located roughly 50 million light-years away in the constellation
  Hydrus. Like many galaxies, NGC 1511 doesn’t travel through space alone. Instead,
  it does so with a pair of small galactic companions called NGC 1511A and NGC 1511B,
  both of which lie outside the frame of this Hubble image. NGC 1511B is situated
  closest to NGC 1511, and the two galaxies have apparently clashed in the past; a
  narrow strand of hydrogen gas connects them, and NGC 1511B has been stretched and
  distorted by the encounter. Researchers have even found evidence that NGC 1511 once
  had another small companion galaxy that it has disrupted entirely! These disruptions
  have an impact on NGC 1511, too. The galaxy is experiencing a burst of star formation,
  and its disc features strange loops and plumes that could point to past interactions
  with its neighbouring galaxies. Researchers will use Hubble’s keen observations
  of NGC 1511 to study star clusters embedded within its dusty gas, seeking to understand
  how matter is cycled from interstellar clouds to stars and back to clouds once again.
  [Image Description: A spiral galaxy, tilted away so that it is seen mostly from
  the edge. The disc of the galaxy glows blue from its centre, due to younger stars
  in the spiral arms. There are large and small patches of gas, glowing in red and
  pink colours, where new stars are forming. Webs of dark dust are spread over the
  disc. The glow of the disc fades into a dark background, with a couple of stars.]
  Links Pan: NGC 1511'
