description: Composite image of the Cigar Galaxy (also called M82), a starburst galaxy
  about 12 million light-years away in the constellation Ursa Major. The magnetic
  field detected by SOFIA, shown as streamlines, appears to follow the bipolar outflows
  (red) generated by the intense nuclear starburst. The image combines visible starlight
  (gray) and a tracing of hydrogen gas (red) from the Kitt Peak Observatory, with
  near-infrared and mid-infrared starlight and dust (yellow) from SOFIA and the Spitzer
  Space Telescope.
