  with contributions from NASA’s Chandra X-ray Observatory. This image presents a
  visual feast of galaxies. Take a moment to zoom in and examine the galactic buffet:
  you’ll see galaxies with delicate spiral arms or warped disks, galaxies with smooth,
  featureless faces, and even galaxies that are interacting or merging and have taken
  on an array of strange shapes. The range of colours is also fascinating, representing
