description: 'A distinct dark lane between two cosmic clouds adds to the brainy appearance
  of nebula PMR 1. The NIRCam (Near-Infrared Camera) instrument on the James Webb
  Space Telescope shows multiple phases of a dying star’s outbursts in one image:
  the skull-like, whitish outer bubble is from an initial ejection, mostly of hydrogen,
  followed by other heavier material, shown in orange in the nebula’s interior. As
  with many NIRCam images, many stars and even distant galaxies can be seen behind
  the nebula. Beyond its unusual appearance there is still much to be uncovered about
  PMR 1. It’s unclear if the star creating the nebula is massive enough to undergo
  a supernova, or if it will evolve into a dense white dwarf once it has shed all
  its outer layers. [Image description: A nebula appears like a transparent bubble
  with a white edge, inside which are two hemispheres of orange clouds being blown
  out from the centre, split by a dark lane, giving the overall appearance of a see-through
  skull with a brain inside, as seen from above. A few stars appear with six points,
  and small background galaxies can be seen around and through the outer bubble.]'
foreground_image_set_url: https://data1.wwtassets.org/feeds/jwst/weic2605c/L{1}X{2}Y{3}.png
name: Exposed Cranium Nebula (NIRCam image)
